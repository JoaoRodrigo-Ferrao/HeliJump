<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Hop - Pixel Art</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            background: linear-gradient(to bottom, #3a86ff, #87ceeb);
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui-layer {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 5;
        }

        /* Modal de Instruções Iniciais */
        #start-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 100, 180, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 30px;
            text-align: center;
            z-index: 10;
        }

        #start-modal h1 {
            font-size: 30px;
            color: #ffe600;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0px #d4380d;
        }

        #start-modal p {
            font-size: 16px;
            color: #f0f0f0;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .controls-info {
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            width: 100%;
        }

        #start-btn {
            margin-top: 15px;
            background: #ffcc00;
            color: #532d00;
            border: 3px solid #ff9900;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #cc7a00;
        }

        #start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cc7a00;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- UI com Pontuação e Recorde -->
        <div id="ui-layer">
            <div>Pontos: <span id="scoreVal">0</span></div>
            <div>Recorde: <span id="highScoreVal">0</span></div>
        </div>

        <!-- Canvas do Jogo -->
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Modal Inicial -->
        <div id="start-modal">
            <h1>SKY HOP</h1>
            <p>Suba pelas nuvens! Cuidado: acima de 300 pontos as nuvens começam a se mover!</p>
            
            <div class="controls-info">
                <p><strong>Como Jogar no Celular:</strong></p>
                <p>👈 Toque na <strong>esquerda</strong> para mover à esquerda</p>
                <p>👉 Toque na <strong>direita</strong> para mover à direita</p>
            </div>

            <button id="start-btn">JOGAR AGORA</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreValElement = document.getElementById("scoreVal");
        const highScoreValElement = document.getElementById("highScoreVal");
        const startModal = document.getElementById("start-modal");
        const startBtn = document.getElementById("start-btn");

        // Sistema de Áudio Sintetizado (Web Audio API)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Som de Pulo
        function playJumpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        // Som de Alerta a cada 100 pontos
        function playMilestoneSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'square';
            osc1.frequency.setValueAtTime(800, now);
            gain1.gain.setValueAtTime(0.15, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.08);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(1200, now + 0.1);
            gain2.gain.setValueAtTime(0.15, now + 0.1);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.1);
            osc2.stop(now + 0.18);
        }

        // Som de Game Over
        function playGameOverSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        // Física do Jogo
        const GRAVITY = 0.38;
        const JUMP_FORCE = -9.8;
        const MOVE_SPEED = 5.5;

        // Estado do Jogador
        let player = {
            x: canvas.width / 2 - 18,
            y: 400,
            width: 36,
            height: 38,
            vx: 0,
            vy: 0,
            facingRight: true
        };

        let platforms = [];
        const platformWidth = 80;
        const platformHeight = 20;
        let score = 0;
        let displayScore = 0;
        let lastMilestone = 0;
        let highScore = localStorage.getItem("sky_hop_high_score") || 0;
        let gameStarted = false;
        let gameOver = false;

        highScoreValElement.innerText = highScore;

        // Controles
        let leftPressed = false;
        let rightPressed = false;

        function createPlatform(y) {
            let p = {
                x: Math.random() * (canvas.width - platformWidth),
                y: y,
                width: platformWidth,
                height: platformHeight,
                isMoving: false,
                moveSpeed: 0,
                direction: 1
            };

            // Níveis de Dificuldade baseados na pontuação implícita da altura gerada
            // (Quanto mais alto, maior a chance de ter nuvens móveis)
            return p;
        }

        function initPlatforms() {
            platforms = [];
            // Plataforma inicial abaixo do jogador
            platforms.push({ x: canvas.width / 2 - 40, y: 520, width: platformWidth, height: platformHeight, isMoving: false });

            let currentY = 440;
            while (currentY > -50) {
                platforms.push(createPlatform(currentY));
                currentY -= 75 + Math.random() * 25;
            }
        }

        // Controles por Toque (Mobile)
        window.addEventListener("touchstart", (e) => {
            if (!gameStarted) return;
            if (gameOver) {
                resetGame();
                return;
            }
            let touchX = e.touches[0].clientX;
            let screenWidth = window.innerWidth;
            if (touchX < screenWidth / 2) {
                leftPressed = true;
                rightPressed = false;
            } else {
                rightPressed = true;
                leftPressed = false;
            }
        });

        window.addEventListener("touchend", () => {
            leftPressed = false;
            rightPressed = false;
        });

        // Controles por Teclado (PC)
        window.addEventListener("keydown", (e) => {
            if (!gameStarted) return;
            if (e.key === "Enter" && gameOver) {
                resetGame();
                return;
            }
            if (e.key === "ArrowLeft") leftPressed = true;
            if (e.key === "ArrowRight") rightPressed = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft") leftPressed = false;
            if (e.key === "ArrowRight") rightPressed = false;
        });

        // Iniciar Jogo via Modal
        startBtn.addEventListener("click", () => {
            initAudio();
            startModal.style.display = "none";
            gameStarted = true;
            resetGame();
        });

        function update() {
            if (!gameStarted || gameOver) return;

            // Movimentação original
            if (leftPressed) {
                player.vx = -MOVE_SPEED;
                player.facingRight = false;
            } else if (rightPressed) {
                player.vx = MOVE_SPEED;
                player.facingRight = true;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;

            // Enrolar nas bordas da tela
            if (player.x > canvas.width) player.x = -player.width;
            if (player.x + player.width < 0) player.x = canvas.width;

            // Gravidade
            player.vy += GRAVITY;
            player.y += player.vy;

            // Atualizar movimento horizontal das plataformas móveis (Níveis de Dificuldade)
            platforms.forEach(plat => {
                if (plat.isMoving) {
                    plat.x += plat.moveSpeed * plat.direction;
                    // Bate nas bordas da tela e inverte o sentido
                    if (plat.x <= 0 || plat.x + plat.width >= canvas.width) {
                        plat.direction *= -1;
                    }
                }
            });

            // Colisão com plataformas em nuvem (apenas descendo)
            if (player.vy > 0) {
                platforms.forEach(plat => {
                    if (
                        player.x + player.width - 8 > plat.x &&
                        player.x + 8 < plat.x + plat.width &&
                        player.y + player.height >= plat.y + 4 &&
                        player.y + player.height <= plat.y + plat.height + player.vy
                    ) {
                        player.vy = JUMP_FORCE;
                        playJumpSound();
                    }
                });
            }

            // Câmera acompanhando a subida
            let cameraThreshold = canvas.height * 0.45;
            if (player.y < cameraThreshold) {
                let diff = cameraThreshold - player.y;
                player.y = cameraThreshold;
                score += diff;
                
                displayScore = Math.floor(score / 10);
                scoreValElement.innerText = displayScore;

                // Som a cada 100 pontos
                if (displayScore >= lastMilestone + 100) {
                    lastMilestone = Math.floor(displayScore / 100) * 100;
                    playMilestoneSound();
                }

                platforms.forEach(plat => {
                    plat.y += diff;
                });
            }

            // Reciclar plataformas no topo com dificuldade progressiva
            platforms.forEach(plat => {
                if (plat.y > canvas.height) {
                    plat.y = -20;
                    plat.x = Math.random() * (canvas.width - platformWidth);
                    plat.direction = Math.random() < 0.5 ? 1 : -1;

                    // Definição de dificuldade por pontuação
                    if (displayScore >= 600) {
                        // Nível Difícil: 50% de chance de se mover rápido
                        plat.isMoving = Math.random() < 0.50;
                        plat.moveSpeed = 2.2 + Math.random() * 1.5;
                    } else if (displayScore >= 300) {
                        // Nível Médio: 30% de chance de se mover devagar
                        plat.isMoving = Math.random() < 0.30;
                        plat.moveSpeed = 1.2 + Math.random() * 0.8;
                    } else {
                        // Nível Fácil: Apenas plataformas fixas
                        plat.isMoving = false;
                    }
                }
            });

            // Game Over
            if (player.y > canvas.height) {
                gameOver = true;
                playGameOverSound();
                if (displayScore > highScore) {
                    highScore = displayScore;
                    localStorage.setItem("sky_hop_high_score", highScore);
                    highScoreValElement.innerText = highScore;
                }
            }
        }

        function resetGame() {
            player.x = canvas.width / 2 - 18;
            player.y = 400;
            player.vx = 0;
            player.vy = 0;
            player.facingRight = true;
            score = 0;
            displayScore = 0;
            lastMilestone = 0;
            scoreValElement.innerText = "0";
            gameOver = false;
            initPlatforms();
        }

        // Desenhar Nuvem em Pixel Art
        function drawPixelCloud(x, y, w, h, isMoving) {
            const ps = 4;
            // Se for nuvem móvel, muda levemente o tom para indicar perigo/movimento
            ctx.fillStyle = isMoving ? "#e0f2fe" : "#ffffff";
            
            ctx.fillRect(x + ps, y + ps, w - (ps * 2), h - (ps * 2));
            ctx.fillRect(x, y + (ps * 2), w, h - (ps * 4));
            ctx.fillRect(x + (ps * 2), y, w - (ps * 4), ps);
            ctx.fillRect(x + (ps * 3), y - ps, w - (ps * 6), ps);

            ctx.fillStyle = isMoving ? "#7dd3fc" : "#b0d4f1";
            ctx.fillRect(x + ps, y + h - (ps * 2), w - (ps * 2), ps);
        }

        // Desenhar o Boneco em Pixel Art
        function drawPixelArtPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            
            if (!player.facingRight) {
                ctx.scale(-1, 1);
            }

            const ps = 3;

            // Corpo
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(-4 * ps, -3 * ps, 8 * ps, 7 * ps);

            // Capacete
            ctx.fillStyle = "#ff3333";
            ctx.fillRect(-5 * ps, -5 * ps, 10 * ps, 2 * ps);
            ctx.fillRect(-3 * ps, -6 * ps, 6 * ps, 1 * ps);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-1 * ps, -5 * ps, 2 * ps, 1 * ps);

            // Olhos
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, -2 * ps, 2 * ps, 2 * ps);

            // Pés
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-3 * ps, 4 * ps, 2 * ps, 2 * ps);
            ctx.fillRect(1 * ps, 4 * ps, 2 * ps, 2 * ps);

            ctx.restore();
        }

        function draw() {
            // Céu com gradiente
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, "#3a86ff");
            grad.addColorStop(0.5, "#6ea8fe");
            grad.addColorStop(1, "#c2e9fb");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar Nuvens (Plataformas)
            platforms.forEach(plat => {
                drawPixelCloud(plat.x, plat.y, plat.width, plat.height, plat.isMoving);
            });

            // Desenhar Boneco
            drawPixelArtPlayer();

            // Tela de Game Over
            if (gameOver) {
                ctx.fillStyle = "rgba(10, 30, 60, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffe600";
                ctx.font = "bold 30px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("FIM DE JOGO", canvas.width / 2, canvas.height / 2 - 50);

                ctx.font = "18px sans-serif";
                ctx.fillStyle = "#ffffff";
                ctx.fillText(`Pontuação: ${displayScore}`, canvas.width / 2, canvas.height / 2 - 5);

                ctx.fillStyle = "#ffcc00";
                ctx.font = "16px sans-serif";
                ctx.fillText(`Melhor Recorde: ${highScore}`, canvas.width / 2, canvas.height / 2 + 25);

                ctx.fillStyle = "#c2e9fb";
                ctx.font = "13px sans-serif";
                ctx.fillText("Toque na tela para jogar novamente", canvas.width / 2, canvas.height / 2 + 75);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initPlatforms();
        loop();
    </script>
</body>
</html>
