<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Hop - Pixel Art</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            background: linear-gradient(to bottom, #3a86ff, #87ceeb);
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center; /* Centralizado perfeitamente na vertical */
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 5;
        }

        /* Modal de Instruções / Menu Inicial */
        #start-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 100, 180, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 25px;
            text-align: center;
            z-index: 10;
        }

        #start-modal h1 {
            font-size: 28px;
            color: #ffe600;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #d4380d;
        }

        #start-modal p {
            font-size: 14px;
            color: #f0f0f0;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .controls-info {
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
            width: 100%;
        }

        /* Seleção de Skins no Menu */
        .skin-selector {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .skin-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .skin-btn.active {
            background: #ffe600;
            color: #532d00;
            border-color: #ff9900;
        }

        #start-btn {
            margin-top: 10px;
            background: #ffcc00;
            color: #532d00;
            border: 3px solid #ff9900;
            padding: 12px 26px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #cc7a00;
        }

        #start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cc7a00;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- UI com Pontuação, Carteira de Moedas e Recorde -->
        <div id="ui-layer">
            <div>Pontos: <span id="scoreVal">0</span></div>
            <div>🪙 <span id="coinsVal">0</span></div>
            <div>Recorde: <span id="highScoreVal">0</span></div>
        </div>

        <!-- Canvas do Jogo -->
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Modal Inicial / Loja de Skins -->
        <div id="start-modal">
            <h1>SKY HOP</h1>
            <p>Suba pelas nuvens, colete moedas e desvie das móveis!</p>
            
            <div class="controls-info">
                <p><strong>Escolha sua Skin:</strong></p>
                <div class="skin-selector" id="skinSelector">
                    <button class="skin-btn active" data-skin="0">🟡 Clássico</button>
                    <button class="skin-btn" data-skin="1">🔵 Ninja</button>
                    <button class="skin-btn" data-skin="2">🤖 Robô</button>
                </div>
            </div>

            <div class="controls-info">
                <p>👈 Toque na <strong>esquerda</strong> | 👉 Toque na <strong>direita</strong></p>
            </div>

            <button id="start-btn">JOGAR AGORA</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreValElement = document.getElementById("scoreVal");
        const coinsValElement = document.getElementById("coinsVal");
        const highScoreValElement = document.getElementById("highScoreVal");
        const startModal = document.getElementById("start-modal");
        const startBtn = document.getElementById("start-btn");
        const skinButtons = document.querySelectorAll(".skin-btn");

        // Sistema de Áudio Sintetizado (Web Audio API)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Som de Pulo
        function playJumpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        // Som de Coleta de Moeda
        function playCoinSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(987.77, now); // Nota B5
            osc.frequency.setValueAtTime(1318.51, now + 0.08); // Nota E6
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }

        // Som de Alerta a cada 100 pontos
        function playMilestoneSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'square';
            osc1.frequency.setValueAtTime(800, now);
            gain1.gain.setValueAtTime(0.15, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.08);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(1200, now + 0.1);
            gain2.gain.setValueAtTime(0.15, now + 0.1);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.1);
            osc2.stop(now + 0.18);
        }

        // Som de Game Over
        function playGameOverSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        // Física e Dados
        const GRAVITY = 0.38;
        const JUMP_FORCE = -9.8;
        const MOVE_SPEED = 5.5;

        let player = {
            x: canvas.width / 2 - 18,
            y: 400,
            width: 36,
            height: 38,
            vx: 0,
            vy: 0,
            facingRight: true,
            skin: 0 // 0: Clássico, 1: Ninja, 2: Robô
        };

        let platforms = [];
        let coins = [];
        const platformWidth = 80;
        const platformHeight = 20;
        let score = 0;
        let displayScore = 0;
        let lastMilestone = 0;
        let totalCoins = parseInt(localStorage.getItem("sky_hop_coins")) || 0;
        let highScore = parseInt(localStorage.getItem("sky_hop_high_score")) || 0;
        let gameStarted = false;
        let gameOver = false;

        highScoreValElement.innerText = highScore;
        coinsValElement.innerText = totalCoins;

        // Seleção de Skin via Botões do Modal
        skinButtons.forEach(btn => {
            btn.addEventListener("click", (e) => {
                skinButtons.forEach(b => b.classList.remove("active"));
                e.target.classList.add("active");
                player.skin = parseInt(e.target.getAttribute("data-skin"));
            });
        });

        // Controles
        let leftPressed = false;
        let rightPressed = false;

        function createPlatform(y) {
            let p = {
                x: Math.random() * (canvas.width - platformWidth),
                y: y,
                width: platformWidth,
                height: platformHeight,
                isMoving: false,
                moveSpeed: 0,
                direction: 1
            };

            // Chance de gerar uma moeda em cima da plataforma
            if (Math.random() < 0.45) {
                coins.push({
                    x: p.x + p.width / 2 - 8,
                    y: y - 24,
                    collected: false
                });
            }

            return p;
        }

        function initPlatforms() {
            platforms = [];
            coins = [];
            platforms.push({ x: canvas.width / 2 - 40, y: 520, width: platformWidth, height: platformHeight, isMoving: false });

            let currentY = 440;
            while (currentY > -50) {
                platforms.push(createPlatform(currentY));
                currentY -= 75 + Math.random() * 25;
            }
        }

        // Toque Mobile
        window.addEventListener("touchstart", (e) => {
            if (!gameStarted) return;
            if (gameOver) {
                resetGame();
                return;
            }
            let touchX = e.touches[0].clientX;
            let screenWidth = window.innerWidth;
            if (touchX < screenWidth / 2) {
                leftPressed = true;
                rightPressed = false;
            } else {
                rightPressed = true;
                leftPressed = false;
            }
        });

        window.addEventListener("touchend", () => {
            leftPressed = false;
            rightPressed = false;
        });

        // Teclado PC
        window.addEventListener("keydown", (e) => {
            if (!gameStarted) return;
            if (e.key === "Enter" && gameOver) {
                resetGame();
                return;
            }
            if (e.key === "ArrowLeft") leftPressed = true;
            if (e.key === "ArrowRight") rightPressed = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft") leftPressed = false;
            if (e.key === "ArrowRight") rightPressed = false;
        });

        startBtn.addEventListener("click", () => {
            initAudio();
            startModal.style.display = "none";
            gameStarted = true;
            resetGame();
        });

        function update() {
            if (!gameStarted || gameOver) return;

            if (leftPressed) {
                player.vx = -MOVE_SPEED;
                player.facingRight = false;
            } else if (rightPressed) {
                player.vx = MOVE_SPEED;
                player.facingRight = true;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;

            if (player.x > canvas.width) player.x = -player.width;
            if (player.x + player.width < 0) player.x = canvas.width;

            player.vy += GRAVITY;
            player.y += player.vy;

            // Movimento das plataformas móveis
            platforms.forEach(plat => {
                if (plat.isMoving) {
                    plat.x += plat.moveSpeed * plat.direction;
                    if (plat.x <= 0 || plat.x + plat.width >= canvas.width) {
                        plat.direction *= -1;
                    }
                }
            });

            // Colisão com plataformas
            if (player.vy > 0) {
                platforms.forEach(plat => {
                    if (
                        player.x + player.width - 8 > plat.x &&
                        player.x + 8 < plat.x + plat.width &&
                        player.y + player.height >= plat.y + 4 &&
                        player.y + player.height <= plat.y + plat.height + player.vy
                    ) {
                        player.vy = JUMP_FORCE;
                        playJumpSound();
                    }
                });
            }

            // Coleta de Moedas
            coins.forEach(coin => {
                if (!coin.collected) {
                    // Colisão simples do jogador com a moeda
                    if (
                        player.x < coin.x + 16 &&
                        player.x + player.width > coin.x &&
                        player.y < coin.y + 16 &&
                        player.y + player.height > coin.y
                    ) {
                        coin.collected = true;
                        totalCoins++;
                        coinsValElement.innerText = totalCoins;
                        localStorage.setItem("sky_hop_coins", totalCoins);
                        playCoinSound();
                    }
                }
            });

            // Câmera subindo
            let cameraThreshold = canvas.height * 0.45;
            if (player.y < cameraThreshold) {
                let diff = cameraThreshold - player.y;
                player.y = cameraThreshold;
                score += diff;
                
                displayScore = Math.floor(score / 10);
                scoreValElement.innerText = displayScore;

                if (displayScore >= lastMilestone + 100) {
                    lastMilestone = Math.floor(displayScore / 100) * 100;
                    playMilestoneSound();
                }

                platforms.forEach(plat => plat.y += diff);
                coins.forEach(coin => coin.y += diff);
            }

            // Reciclar plataformas e moedas que saem por baixo
            platforms.forEach((plat, index) => {
                if (plat.y > canvas.height) {
                    plat.y = -20;
                    plat.x = Math.random() * (canvas.width - platformWidth);
                    plat.direction = Math.random() < 0.5 ? 1 : -1;

                    if (displayScore >= 600) {
                        plat.isMoving = Math.random() < 0.50;
                        plat.moveSpeed = 2.2 + Math.random() * 1.5;
                    } else if (displayScore >= 300) {
                        plat.isMoving = Math.random() < 0.30;
                        plat.moveSpeed = 1.2 + Math.random() * 0.8;
                    } else {
                        plat.isMoving = false;
                    }

                    // Reciclar moeda correspondente
                    if (coins[index]) {
                        coins[index].collected = false;
                        coins[index].x = plat.x + plat.width / 2 - 8;
                        coins[index].y = plat.y - 24;
                    }
                }
            });

            // Game Over
            if (player.y > canvas.height) {
                gameOver = true;
                playGameOverSound();
                if (displayScore > highScore) {
                    highScore = displayScore;
                    localStorage.setItem("sky_hop_high_score", highScore);
                    highScoreValElement.innerText = highScore;
                }
            }
        }

        function resetGame() {
            player.x = canvas.width / 2 - 18;
            player.y = 400;
            player.vx = 0;
            player.vy = 0;
            player.facingRight = true;
            score = 0;
            displayScore = 0;
            lastMilestone = 0;
            scoreValElement.innerText = "0";
            gameOver = false;
            initPlatforms();
        }

        // Desenhar Nuvem em Pixel Art
        function drawPixelCloud(x, y, w, h, isMoving) {
            const ps = 4;
            ctx.fillStyle = isMoving ? "#e0f2fe" : "#ffffff";
            ctx.fillRect(x + ps, y + ps, w - (ps * 2), h - (ps * 2));
            ctx.fillRect(x, y + (ps * 2), w, h - (ps * 4));
            ctx.fillRect(x + (ps * 2), y, w - (ps * 4), ps);
            ctx.fillRect(x + (ps * 3), y - ps, w - (ps * 6), ps);

            ctx.fillStyle = isMoving ? "#7dd3fc" : "#b0d4f1";
            ctx.fillRect(x + ps, y + h - (ps * 2), w - (ps * 2), ps);
        }

        // Desenhar Moeda em Pixel Art
        function drawPixelCoin(x, y) {
            const ps = 2;
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(x + ps, y, 4 * ps, 6 * ps);
            ctx.fillStyle = "#fff066"; // Brilho interno
            ctx.fillRect(x + (2 * ps), y + ps, 2 * ps, 4 * ps);
            ctx.fillStyle = "#cc9900"; // Borda
            ctx.fillRect(x, y + ps, ps, 4 * ps);
            ctx.fillRect(x + (5 * ps), y + ps, ps, 4 * ps);
        }

        // Desenhar o Boneco em Pixel Art com 3 Skins diferentes
        function drawPixelArtPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            
            if (!player.facingRight) {
                ctx.scale(-1, 1);
            }

            const ps = 3;

            if (player.skin === 0) {
                // Skin 0: Clássico Amarelo com chapéu vermelho
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(-4 * ps, -3 * ps, 8 * ps, 7 * ps);
                ctx.fillStyle = "#ff3333";
                ctx.fillRect(-5 * ps, -5 * ps, 10 * ps, 2 * ps);
                ctx.fillRect(-3 * ps, -6 * ps, 6 * ps, 1 * ps);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-1 * ps, -5 * ps, 2 * ps, 1 * ps);
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, -2 * ps, 2 * ps, 2 * ps);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-3 * ps, 4 * ps, 2 * ps, 2 * ps);
                ctx.fillRect(1 * ps, 4 * ps, 2 * ps, 2 * ps);
            } 
            else if (player.skin === 1) {
                // Skin 1: Ninja Azul com faixa vermelha
                ctx.fillStyle = "#3366ff";
                ctx.fillRect(-4 * ps, -3 * ps, 8 * ps, 7 * ps);
                ctx.fillStyle = "#1a3399";
                ctx.fillRect(-4 * ps, -5 * ps, 8 * ps, 2 * ps);
                ctx.fillStyle = "#ff3333"; // Faixa
                ctx.fillRect(-4 * ps, -4 * ps, 8 * ps, 1 * ps);
                ctx.fillStyle = "#ffffff"; // Olhos ninja
                ctx.fillRect(0, -3 * ps, 2 * ps, 1 * ps);
                ctx.fillStyle = "#1a3399";
                ctx.fillRect(-3 * ps, 4 * ps, 2 * ps, 2 * ps);
                ctx.fillRect(1 * ps, 4 * ps, 2 * ps, 2 * ps);
            } 
            else if (player.skin === 2) {
                // Skin 2: Robô Cyber Prateado com Visor Verde
                ctx.fillStyle = "#cccccc";
                ctx.fillRect(-4 * ps, -3 * ps, 8 * ps, 7 * ps);
                ctx.fillStyle = "#999999";
                ctx.fillRect(-4 * ps, -5 * ps, 8 * ps, 2 * ps);
                ctx.fillStyle = "#00ff66"; // Visor tecnológico
                ctx.fillRect(-1 * ps, -3 * ps, 3 * ps, 1 * ps);
                ctx.fillStyle = "#666666";
                ctx.fillRect(-3 * ps, 4 * ps, 2 * ps, 2 * ps);
                ctx.fillRect(1 * ps, 4 * ps, 2 * ps, 2 * ps);
            }

            ctx.restore();
        }

        function draw() {
            // Céu
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, "#3a86ff");
            grad.addColorStop(0.5, "#6ea8fe");
            grad.addColorStop(1, "#c2e9fb");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Nuvens
            platforms.forEach(plat => {
                drawPixelCloud(plat.x, plat.y, plat.width, plat.height, plat.isMoving);
            });

            // Moedas
            coins.forEach(coin => {
                if (!coin.collected) {
                    drawPixelCoin(coin.x, coin.y);
                }
            });

            // Boneco
            drawPixelArtPlayer();

            // Tela de Game Over
            if (gameOver) {
                ctx.fillStyle = "rgba(10, 30, 60, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffe600";
                ctx.font = "bold 30px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("FIM DE JOGO", canvas.width / 2, canvas.height / 2 - 55);

                ctx.font = "16px sans-serif";
                ctx.fillStyle = "#ffffff";
                ctx.fillText(`Pontuação: ${displayScore}`, canvas.width / 2, canvas.height / 2 - 15);

                ctx.fillStyle = "#ffcc00";
                ctx.fillText(`Moedas Coletadas: ${totalCoins}`, canvas.width / 2, canvas.height / 2 + 15);

                ctx.fillStyle = "#c2e9fb";
                ctx.font = "13px sans-serif";
                ctx.fillText("Toque na tela para jogar novamente", canvas.width / 2, canvas.height / 2 + 65);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initPlatforms();
        loop();
    </script>
</body>
</html>
