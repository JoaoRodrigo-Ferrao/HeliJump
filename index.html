<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jump Hop - Salto Infinito</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #ui-layer {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 5;
        }

        /* Modal de Instruções Iniciais */
        #start-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 26, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 30px;
            text-align: center;
            z-index: 10;
        }

        #start-modal h1 {
            font-size: 28px;
            color: #4ecca3;
            margin-bottom: 15px;
        }

        #start-modal p {
            font-size: 16px;
            color: #dddddd;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .controls-info {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            width: 100%;
        }

        #start-btn {
            margin-top: 15px;
            background: #4ecca3;
            color: #111;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(78, 204, 163, 0.4);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- UI com Pontuação e Recorde -->
        <div id="ui-layer">
            <div>Pontos: <span id="scoreVal">0</span></div>
            <div>Recorde: <span id="highScoreVal">0</span></div>
        </div>

        <!-- Canvas do Jogo -->
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Modal Inicial -->
        <div id="start-modal">
            <h1>Jump Hop!</h1>
            <p>Suba o máximo de plataformas que conseguir e supere seu recorde!</p>
            
            <div class="controls-info">
                <p><strong>Como Jogar no Celular:</strong></p>
                <p>👈 Toque na <strong>esquerda</strong> para mover à esquerda</p>
                <p>👉 Toque na <strong>direita</strong> para mover à direita</p>
            </div>

            <button id="start-btn">TOQUE PARA JOGAR</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreValElement = document.getElementById("scoreVal");
        const highScoreValElement = document.getElementById("highScoreVal");
        const startModal = document.getElementById("start-modal");
        const startBtn = document.getElementById("start-btn");

        // Sistema de Áudio Sintetizado (Web Audio API)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Som de Pulo
        function playJumpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        // Som de Alerta a cada 100 pontos (estilo dinossauro do Chrome)
        function playMilestoneSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'square';
            osc1.frequency.setValueAtTime(800, now);
            gain1.gain.setValueAtTime(0.15, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.08);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(1200, now + 0.1);
            gain2.gain.setValueAtTime(0.15, now + 0.1);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.1);
            osc2.stop(now + 0.18);
        }

        // Física e Configurações
        const GRAVITY = 0.38;
        const JUMP_FORCE = -9.8;
        const ACCELERATION = 0.7; // Suavidade no arranque
        const FRICTION = 0.86;    // Suavidade na desaceleração

        // Estado do Jogador
        let player = {
            x: canvas.width / 2 - 18,
            y: 400,
            width: 36,
            height: 42,
            vx: 0,
            vy: 0,
            facingRight: true
        };

        let platforms = [];
        const platformWidth = 75;
        const platformHeight = 16;
        let score = 0;
        let displayScore = 0;
        let lastMilestone = 0;
        let highScore = localStorage.getItem("jump_high_score") || 0;
        let gameStarted = false;
        let gameOver = false;

        highScoreValElement.innerText = highScore;

        // Controles
        let leftPressed = false;
        let rightPressed = false;

        function initPlatforms() {
            platforms = [];
            platforms.push({ x: canvas.width / 2 - 37, y: 520, width: platformWidth, height: platformHeight });

            let currentY = 440;
            while (currentY > -50) {
                platforms.push({
                    x: Math.random() * (canvas.width - platformWidth),
                    y: currentY,
                    width: platformWidth,
                    height: platformHeight
                });
                currentY -= 75 + Math.random() * 25;
            }
        }

        // Controles por Toque (Mobile)
        window.addEventListener("touchstart", (e) => {
            if (!gameStarted) return;
            if (gameOver) {
                resetGame();
                return;
            }
            let touchX = e.touches[0].clientX;
            let screenWidth = window.innerWidth;
            if (touchX < screenWidth / 2) {
                leftPressed = true;
                rightPressed = false;
            } else {
                rightPressed = true;
                leftPressed = false;
            }
        });

        window.addEventListener("touchend", () => {
            leftPressed = false;
            rightPressed = false;
        });

        // Controles por Teclado (PC)
        window.addEventListener("keydown", (e) => {
            if (!gameStarted) return;
            if (e.key === "Enter" && gameOver) {
                resetGame();
                return;
            }
            if (e.key === "ArrowLeft") leftPressed = true;
            if (e.key === "ArrowRight") rightPressed = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft") leftPressed = false;
            if (e.key === "ArrowRight") rightPressed = false;
        });

        // Iniciar Jogo via Modal
        startBtn.addEventListener("click", () => {
            initAudio();
            startModal.style.display = "none";
            gameStarted = true;
            resetGame();
        });

        function update() {
            if (!gameStarted || gameOver) return;

            // Movimentação Suave (Aceleração e Inércia)
            if (leftPressed) {
                player.vx -= ACCELERATION;
                player.facingRight = false;
            } else if (rightPressed) {
                player.vx += ACCELERATION;
                player.facingRight = true;
            } else {
                player.vx *= FRICTION;
            }

            player.x += player.vx;

            // Enrolar nas bordas da tela
            if (player.x > canvas.width) player.x = -player.width;
            if (player.x + player.width < 0) player.x = canvas.width;

            // Gravidade
            player.vy += GRAVITY;
            player.y += player.vy;

            // Colisão com plataformas (apenas descendo)
            if (player.vy > 0) {
                platforms.forEach(plat => {
                    if (
                        player.x + player.width - 8 > plat.x &&
                        player.x + 8 < plat.x + plat.width &&
                        player.y + player.height >= plat.y &&
                        player.y + player.height <= plat.y + plat.height + player.vy
                    ) {
                        player.vy = JUMP_FORCE;
                        playJumpSound();
                    }
                });
            }

            // Câmera acompanhando a subida
            let cameraThreshold = canvas.height * 0.45;
            if (player.y < cameraThreshold) {
                let diff = cameraThreshold - player.y;
                player.y = cameraThreshold;
                score += diff;
                
                displayScore = Math.floor(score / 10);
                scoreValElement.innerText = displayScore;

                // Som a cada 100 pontos
                if (displayScore >= lastMilestone + 100) {
                    lastMilestone = Math.floor(displayScore / 100) * 100;
                    playMilestoneSound();
                }

                platforms.forEach(plat => {
                    plat.y += diff;
                });
            }

            // Reciclar plataformas no topo
            platforms.forEach(plat => {
                if (plat.y > canvas.height) {
                    plat.y = -20;
                    plat.x = Math.random() * (canvas.width - platformWidth);
                }
            });

            // Game Over
            if (player.y > canvas.height) {
                gameOver = true;
                if (displayScore > highScore) {
                    highScore = displayScore;
                    localStorage.setItem("jump_high_score", highScore);
                    highScoreValElement.innerText = highScore;
                }
            }
        }

        function resetGame() {
            player.x = canvas.width / 2 - 18;
            player.y = 400;
            player.vx = 0;
            player.vy = 0;
            player.facingRight = true;
            score = 0;
            displayScore = 0;
            lastMilestone = 0;
            scoreValElement.innerText = "0";
            gameOver = false;
            initPlatforms();
        }

        // Desenhar o Boneco em Vetor/Canvas
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            
            // Inverter para olhar à esquerda ou à direita
            if (!player.facingRight) {
                ctx.scale(-1, 1);
            }

            // Corpo/Camisa
            ctx.fillStyle = "#ff5722";
            ctx.beginPath();
            ctx.roundRect(-12, -2, 24, 22, 6);
            ctx.fill();

            // Cabeça
            ctx.fillStyle = "#ffccaa";
            ctx.beginPath();
            ctx.arc(0, -12, 12, 0, Math.PI * 2);
            ctx.fill();

            // Cabelo
            ctx.fillStyle = "#4a2c11";
            ctx.beginPath();
            ctx.arc(0, -15, 12, Math.PI, 0);
            ctx.fill();

            // Olhos (Virados para a direção do movimento)
            ctx.fillStyle = "#111";
            ctx.beginPath();
            ctx.arc(4, -13, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Mochila de Salto
            ctx.fillStyle = "#333";
            ctx.fillRect(-16, -2, 5, 16);

            // Pés/Sapatos
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-10, 18, 8, 5);
            ctx.fillRect(2, 18, 8, 5);

            ctx.restore();
        }

        function draw() {
            // Fundo
            ctx.fillStyle = "#12121c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar Plataformas
            platforms.forEach(plat => {
                ctx.fillStyle = "#4ecca3";
                ctx.beginPath();
                ctx.roundRect(plat.x, plat.y, plat.width, plat.height, 8);
                ctx.fill();
            });

            // Desenhar Boneco
            drawPlayer();

            // Tela de Game Over
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 30px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("FIM DE JOGO", canvas.width / 2, canvas.height / 2 - 40);

                ctx.font = "18px sans-serif";
                ctx.fillStyle = "#4ecca3";
                ctx.fillText(`Pontuação: ${displayScore}`, canvas.width / 2, canvas.height / 2 + 5);

                ctx.fillStyle = "#ffbb33";
                ctx.font = "16px sans-serif";
                ctx.fillText(`Melhor Recorde: ${highScore}`, canvas.width / 2, canvas.height / 2 + 35);

                ctx.fillStyle = "#aaaaaa";
                ctx.font = "14px sans-serif";
                ctx.fillText("Toque na tela para jogar novamente", canvas.width / 2, canvas.height / 2 + 80);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initPlatforms();
        loop();
    </script>
</body>
</html>
