<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Hop - Pixel Art</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            padding: 12px 20px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 5;
        }

        #start-modal, #gameover-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 100, 180, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 25px;
            text-align: center;
            z-index: 10;
        }

        #gameover-modal {
            display: none;
            background: rgba(10, 30, 60, 0.95);
        }

        #start-modal h1, #gameover-modal h1 {
            font-size: 32px;
            color: #ffe600;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #d4380d;
        }

        #start-modal p, #gameover-modal p {
            font-size: 14px;
            color: #f0f0f0;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .controls-info {
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0;
            width: 100%;
        }

        .menu-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            align-items: center;
        }

        .primary-btn {
            background: #ffcc00;
            color: #532d00;
            border: 3px solid #ff9900;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #cc7a00;
        }

        .primary-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cc7a00;
        }

        .shop-btn-style {
            background: #22c55e;
            color: white;
            border: 3px solid #15803d;
            width: 50px;
            height: 50px;
            font-size: 22px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #166534;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shop-btn-style:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #166534;
        }

        .version-watermark {
            position: absolute;
            bottom: 12px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            pointer-events: none;
        }

        #shop-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.98);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 25px;
            z-index: 20;
        }

        #shop-modal h2 {
            color: #ffe600;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .shop-balance {
            font-size: 15px;
            color: #4efc8d;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .skin-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 20px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .skin-item {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .skin-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .skin-preview-canvas {
            width: 36px;
            height: 36px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .skin-info {
            text-align: left;
        }

        .skin-name {
            font-weight: bold;
            font-size: 14px;
            color: #f8fafc;
        }

        .skin-price {
            font-size: 11px;
            color: #ffcc00;
            margin-top: 2px;
        }

        .skin-action-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .skin-action-btn.equipped {
            background: #22c55e;
            cursor: default;
        }

        .skin-action-btn.locked {
            background: #94a3b8;
            color: #334155;
            cursor: pointer;
        }

        .skin-action-btn.buyable {
            background: #eab308;
            color: #422006;
            cursor: pointer;
        }

        #close-shop-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div>Pontos: <span id="scoreVal">0</span></div>
            <div>🪙 <span id="coinsVal">0</span></div>
            <div>Recorde: <span id="highScoreVal">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div id="start-modal">
            <h1>SKY HOP</h1>
            <p>Suba pelas nuvens, desvie das frágeis e conquiste o topo!</p>
            
            <div class="controls-info">
                <p>👈 Toque na <strong>esquerda</strong> | 👉 Toque na <strong>direita</strong></p>
            </div>

            <div class="menu-buttons">
                <button id="start-btn" class="primary-btn">JOGAR</button>
                <button id="shop-icon-btn" class="shop-btn-style" title="Loja de Skins">🛒</button>
            </div>

            <div class="version-watermark">v1.3.0-beta</div>
        </div>

        <div id="gameover-modal">
            <h1>FIM DE JOGO</h1>
            <p>Pontuação: <span id="finalScoreVal">0</span></p>
            <p style="color: #ffcc00;">Moedas Coletadas: <span id="finalCoinsVal">0</span></p>
            
            <div class="menu-buttons">
                <button id="restart-btn" class="primary-btn">JOGAR DE NOVO</button>
                <button id="gameover-shop-btn" class="shop-btn-style" title="Loja de Skins">🛒</button>
            </div>

            <div class="version-watermark">v1.3.0-beta</div>
        </div>

        <div id="shop-modal">
            <h2>LOJA DE SKINS</h2>
            <div class="shop-balance">Suas Moedas: 🪙 <span id="shopCoinsVal">0</span></div>
            
            <div class="skin-list" id="skinListContainer"></div>

            <button id="close-shop-btn">VOLTAR</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreValElement = document.getElementById("scoreVal");
        const coinsValElement = document.getElementById("coinsVal");
        const highScoreValElement = document.getElementById("highScoreVal");
        const startModal = document.getElementById("start-modal");
        const startBtn = document.getElementById("start-btn");
        const restartBtn = document.getElementById("restart-btn");
        const gameOverModal = document.getElementById("gameover-modal");
        const finalScoreVal = document.getElementById("finalScoreVal");
        const finalCoinsVal = document.getElementById("finalCoinsVal");
        const shopIconBtn = document.getElementById("shop-icon-btn");
        const gameOverShopBtn = document.getElementById("gameover-shop-btn");
        const shopModal = document.getElementById("shop-modal");
        const closeShopBtn = document.getElementById("close-shop-btn");
        const shopCoinsVal = document.getElementById("shopCoinsVal");
        const skinListContainer = document.getElementById("skinListContainer");

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playJumpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playBreakSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        }

        function playCoinSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(987.77, now);
            osc.frequency.setValueAtTime(1318.51, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }

        function playMilestoneSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'square';
            osc1.frequency.setValueAtTime(800, now);
            gain1.gain.setValueAtTime(0.15, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.08);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(1200, now + 0.1);
            gain2.gain.setValueAtTime(0.15, now + 0.1);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.1);
            osc2.stop(now + 0.18);
        }

        function playGameOverSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        const skinsData = [
            { id: 0, name: "Aviador Estelar", price: 0 },
            { id: 1, name: "Ninja das Sombras", price: 50 },
            { id: 2, name: "Andróide Cyber", price: 100 }
        ];

        let totalCoins = parseInt(localStorage.getItem("sky_hop_coins")) || 0;
        let highScore = parseInt(localStorage.getItem("sky_hop_high_score")) || 0;
        let unlockedSkins = JSON.parse(localStorage.getItem("sky_hop_unlocked")) || [0];
        let currentSkin = parseInt(localStorage.getItem("sky_hop_current_skin")) || 0;

        highScoreValElement.innerText = highScore;
        coinsValElement.innerText = totalCoins;

        const GRAVITY = 0.38;
        const JUMP_FORCE = -9.8;
        const MOVE_SPEED = 5.5;

        let player = {
            x: canvas.width / 2 - 18,
            y: 400,
            width: 36,
            height: 38,
            vx: 0,
            vy: 0,
            facingRight: true,
            skin: currentSkin
        };

        let platforms = [];
        let coins = [];
        const platformWidth = 80;
        const platformHeight = 20;
        let score = 0;
        let displayScore = 0;
        let lastMilestone = 0;
        let gameStarted = false;
        let gameOver = false;

        function drawCharacterPreview(previewCanvas, skinId) {
            const pCtx = previewCanvas.getContext("2d");
            pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            pCtx.save();
            pCtx.translate(previewCanvas.width / 2, previewCanvas.height / 2 + 3);

            const ps = 2.2;

            if (skinId === 0) {
                pCtx.fillStyle = "#8b4513";
                pCtx.fillRect(-4 * ps, -6 * ps, 8 * ps, 2 * ps);
                pCtx.fillStyle = "#d4af37";
                pCtx.fillRect(-3 * ps, -5 * ps, 6 * ps, 1 * ps);
                pCtx.fillStyle = "#ffdbac";
                pCtx.fillRect(-3 * ps, -4 * ps, 6 * ps, 3 * ps);
                pCtx.fillStyle = "#000000";
                pCtx.fillRect(-2 * ps, -3 * ps, 1 * ps, 1 * ps);
                pCtx.fillRect(1 * ps, -3 * ps, 1 * ps, 1 * ps);
                pCtx.fillStyle = "#3a86ff";
                pCtx.fillRect(-4 * ps, -1 * ps, 8 * ps, 5 * ps);
                pCtx.fillStyle = "#ffcc00";
                pCtx.fillRect(-1 * ps, -1 * ps, 2 * ps, 3 * ps);
            } else if (skinId === 1) {
                pCtx.fillStyle = "#ff3333";
                pCtx.fillRect(-4 * ps, -6 * ps, 8 * ps, 1 * ps);
                pCtx.fillStyle = "#1e293b";
                pCtx.fillRect(-4 * ps, -5 * ps, 8 * ps, 3 * ps);
                pCtx.fillStyle = "#ffffff";
                pCtx.fillRect(-2 * ps, -4 * ps, 1 * ps, 1 * ps);
                pCtx.fillRect(1 * ps, -4 * ps, 1 * ps, 1 * ps);
                pCtx.fillStyle = "#1e293b";
                pCtx.fillRect(-4 * ps, -2 * ps, 8 * ps, 6 * ps);
                pCtx.fillStyle = "#06b6d4";
                pCtx.fillRect(-3 * ps, 0, 6 * ps, 1 * ps);
            } else if (skinId === 2) {
                pCtx.fillStyle = "#64748b";
                pCtx.fillRect(-4 * ps, -6 * ps, 8 * ps, 2 * ps);
                pCtx.fillStyle = "#22c55e";
                pCtx.fillRect(-3 * ps, -4 * ps, 6 * ps, 2 * ps);
                pCtx.fillStyle = "#475569";
                pCtx.fillRect(-4 * ps, -2 * ps, 8 * ps, 6 * ps);
                pCtx.fillStyle = "#4ade80";
                pCtx.fillRect(-1 * ps, -1 * ps, 2 * ps, 4 * ps);
            }

            pCtx.restore();
        }

        function renderShop() {
            shopCoinsVal.innerText = totalCoins;
            coinsValElement.innerText = totalCoins;
            skinListContainer.innerHTML = "";

            skinsData.forEach(skin => {
                let isUnlocked = unlockedSkins.includes(skin.id);
                let isEquipped = (player.skin === skin.id);

                let btnClass = "";
                let btnText = "";

                if (isEquipped) {
                    btnClass = "equipped";
                    btnText = "Equipado";
                } else if (isUnlocked) {
                    btnClass = "";
                    btnText = "Equipar";
                } else {
                    if (totalCoins >= skin.price) {
                        btnClass = "buyable";
                        btnText = `Comprar (${skin.price}🪙)`;
                    } else {
                        btnClass = "locked";
                        btnText = `${skin.price}🪙`;
                    }
                }

                let itemDiv = document.createElement("div");
                itemDiv.className = "skin-item";
                itemDiv.innerHTML = `
                    <div class="skin-left">
                        <canvas class="skin-preview-canvas" width="36" height="36" data-skin="${skin.id}"></canvas>
                        <div class="skin-info">
                            <div class="skin-name">${skin.name}</div>
                            <div class="skin-price">${skin.price === 0 ? 'Grátis' : skin.price + ' moedas'}</div>
                        </div>
                    </div>
                    <button class="skin-action-btn ${btnClass}" data-id="${skin.id}">${btnText}</button>
                `;

                skinListContainer.appendChild(itemDiv);
            });

            // Desenha as miniaturas em canvas das skins
            document.querySelectorAll(".skin-preview-canvas").forEach(canvasEl => {
                let skinId = parseInt(canvasEl.getAttribute("data-skin"));
                drawCharacterPreview(canvasEl, skinId);
            });

            document.querySelectorAll(".skin-action-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    let skinId = parseInt(e.target.getAttribute("data-id"));
                    let skin = skinsData.find(s => s.id === skinId);

                    if (unlockedSkins.includes(skinId)) {
                        player.skin = skinId;
                        localStorage.setItem("sky_hop_current_skin", skinId);
                        renderShop();
                    } else {
                        if (totalCoins >= skin.price) {
                            totalCoins -= skin.price;
                            coinsValElement.innerText = totalCoins;
                            localStorage.setItem("sky_hop_coins", totalCoins);

                            unlockedSkins.push(skinId);
                            localStorage.setItem("sky_hop_unlocked", JSON.stringify(unlockedSkins));

                            player.skin = skinId;
                            localStorage.setItem("sky_hop_current_skin", skinId);

                            playCoinSound();
                            renderShop();
                        }
                    }
                });
            });
        }

        shopIconBtn.addEventListener("click", () => {
            initAudio();
            renderShop();
            shopModal.style.display = "flex";
        });

        gameOverShopBtn.addEventListener("click", () => {
            initAudio();
            renderShop();
            shopModal.style.display = "flex";
        });

        closeShopBtn.addEventListener("click", () => {
            shopModal.style.display = "none";
        });

        function createPlatform(y) {
            let p = {
                x: Math.random() * (canvas.width - platformWidth),
                y: y,
                width: platformWidth,
                height: platformHeight,
                isMoving: false,
                moveSpeed: 0,
                direction: 1,
                isFragile: false,
                broken: false
            };

            if (displayScore >= 40 && Math.random() < 0.25) {
                p.isFragile = true;
            }

            if (displayScore >= 600) {
                p.isMoving = Math.random() < 0.50;
                p.moveSpeed = 2.2 + Math.random() * 1.5;
            } else if (displayScore >= 150) {
                p.isMoving = Math.random() < 0.30;
                p.moveSpeed = 1.2 + Math.random() * 0.8;
            }

            return p;
        }

        function initPlatforms() {
            platforms = [];
            coins = [];
            let firstPlat = { x: canvas.width / 2 - 40, y: 520, width: platformWidth, height: platformHeight, isMoving: false, isFragile: false, broken: false };
            platforms.push(firstPlat);

            // Adiciona moeda na primeira plataforma inicial
            coins.push({
                parentPlatform: firstPlat,
                offsetX: platformWidth / 2 - 8,
                offsetY: -35,
                width: 16,
                height: 16
            });

            let currentY = 440;
            while (currentY > -50) {
                let p = createPlatform(currentY);
                platforms.push(p);
                if (Math.random() < 0.40) {
                    coins.push({
                        parentPlatform: p,
                        offsetX: platformWidth / 2 - 8,
                        offsetY: -35,
                        width: 16,
                        height: 16
                    });
                }
                currentY -= 75 + Math.random() * 25;
            }
        }

        let leftPressed = false;
        let rightPressed = false;

        window.addEventListener("touchstart", (e) => {
            if (!gameStarted || shopModal.style.display === "flex") return;
            let touchX = e.touches[0].clientX;
            let screenWidth = window.innerWidth;
            if (touchX < screenWidth / 2) {
                leftPressed = true;
                rightPressed = false;
            } else {
                rightPressed = true;
                leftPressed = false;
            }
        });

        window.addEventListener("touchend", () => {
            leftPressed = false;
            rightPressed = false;
        });

        window.addEventListener("keydown", (e) => {
            if (!gameStarted || shopModal.style.display === "flex") return;
            if (e.key === "ArrowLeft") leftPressed = true;
            if (e.key === "ArrowRight") rightPressed = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft") leftPressed = false;
            if (e.key === "ArrowRight") rightPressed = false;
        });

        startBtn.addEventListener("click", () => {
            initAudio();
            startModal.style.display = "none";
            gameStarted = true;
            resetGame();
        });

        restartBtn.addEventListener("click", () => {
            initAudio();
            gameOverModal.style.display = "none";
            gameStarted = true;
            resetGame();
        });

        function update() {
            if (!gameStarted || gameOver) return;

            if (leftPressed) {
                player.vx = -MOVE_SPEED;
                player.facingRight = false;
            } else if (rightPressed) {
                player.vx = MOVE_SPEED;
                player.facingRight = true;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;

            if (player.x > canvas.width) player.x = -player.width;
            if (player.x + player.width < 0) player.x = canvas.width;

            player.vy += GRAVITY;
            player.y += player.vy;

            platforms.forEach(plat => {
                if (plat.isMoving) {
                    plat.x += plat.moveSpeed * plat.direction;
                    if (plat.x <= 0 || plat.x + plat.width >= canvas.width) {
                        plat.direction *= -1;
                    }
                }
            });

            if (player.vy > 0) {
                platforms.forEach(plat => {
                    if (
                        !plat.broken &&
                        player.x + player.width - 8 > plat.x &&
                        player.x + 8 < plat.x + plat.width &&
                        player.y + player.height >= plat.y + 4 &&
                        player.y + player.height <= plat.y + plat.height + player.vy
                    ) {
                        player.vy = JUMP_FORCE;
                        playJumpSound();

                        if (plat.isFragile) {
                            plat.broken = true;
                            playBreakSound();
                        }
                    }
                });
            }

            // Atualiza a posição X e Y das moedas amarradas nas plataformas ativas
            coins.forEach(coin => {
                if (coin.parentPlatform) {
                    coin.x = coin.parentPlatform.x + coin.offsetX;
                    coin.y = coin.parentPlatform.y + coin.offsetY;
                }
            });

            // Verificação de colisão com as moedas
            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                if (
                    player.x < coin.x + coin.width &&
                    player.x + player.width > coin.x &&
                    player.y < coin.y + coin.height &&
                    player.y + player.height > coin.y
                ) {
                    coins.splice(i, 1);
                    totalCoins++;
                    coinsValElement.innerText = totalCoins;
                    localStorage.setItem("sky_hop_coins", totalCoins);
                    playCoinSound();
                }
            }

            let cameraThreshold = canvas.height * 0.45;
            if (player.y < cameraThreshold) {
                let diff = cameraThreshold - player.y;
                player.y = cameraThreshold;
                score += diff;
                
                displayScore = Math.floor(score / 10);
                scoreValElement.innerText = displayScore;

                if (displayScore >= lastMilestone + 100) {
                    lastMilestone = Math.floor(displayScore / 100) * 100;
                    playMilestoneSound();
                }

                platforms.forEach(plat => plat.y += diff);
            }

            // Reciclagem de plataformas e recriação limpa de moedas
            platforms.forEach(plat => {
                if (plat.y > canvas.height) {
                    plat.y = -20;
                    plat.x = Math.random() * (canvas.width - platformWidth);
                    plat.direction = Math.random() < 0.5 ? 1 : -1;
                    plat.broken = false;

                    if (displayScore >= 40) {
                        plat.isFragile = Math.random() < 0.30;
                    }

                    if (displayScore >= 600) {
                        plat.isMoving = Math.random() < 0.50;
                        plat.moveSpeed = 2.2 + Math.random() * 1.5;
                    } else if (displayScore >= 150) {
                        plat.isMoving = Math.random() < 0.30;
                        plat.moveSpeed = 1.2 + Math.random() * 0.8;
                    } else {
                        plat.isMoving = false;
                    }

                    // Remove qualquer moeda antiga órfã desta plataforma
                    coins = coins.filter(c => c.parentPlatform !== plat);

                    // Cria nova moeda acoplada com 40% de chance
                    if (Math.random() < 0.40) {
                        coins.push({
                            parentPlatform: plat,
                            offsetX: platformWidth / 2 - 8,
                            offsetY: -35,
                            width: 16,
                            height: 16
                        });
                    }
                }
            });

            // Limpeza de moedas cujas nuvens quebraram ou saíram da tela
            coins = coins.filter(coin => coin.y < canvas.height + 50 && !coin.parentPlatform.broken);

            if (player.y > canvas.height) {
                gameOver = true;
                playGameOverSound();
                if (displayScore > highScore) {
                    highScore = displayScore;
                    localStorage.setItem("sky_hop_high_score", highScore);
                    highScoreValElement.innerText = highScore;
                }

                finalScoreVal.innerText = displayScore;
                finalCoinsVal.innerText = totalCoins;
                gameOverModal.style.display = "flex";
            }
        }

        function resetGame() {
            player.x = canvas.width / 2 - 18;
            player.y = 400;
            player.vx = 0;
            player.vy = 0;
            player.facingRight = true;
            score = 0;
            displayScore = 0;
            lastMilestone = 0;
            scoreValElement.innerText = "0";
            gameOver = false;
            initPlatforms();
        }

        function drawPixelCloud(x, y, w, h, isMoving, isFragile, broken) {
            if (broken) return;
            const ps = 4;
            
            ctx.fillStyle = isFragile ? "#cbd5e1" : (isMoving ? "#e0f2fe" : "#ffffff");
            ctx.fillRect(x + ps, y + ps, w - (ps * 2), h - (ps * 2));
            ctx.fillRect(x, y + (ps * 2), w, h - (ps * 4));
            ctx.fillRect(x + (ps * 2), y, w - (ps * 4), ps);
            ctx.fillRect(x + (ps * 3), y - ps, w - (ps * 6), ps);

            ctx.fillStyle = isFragile ? "#94a3b8" : (isMoving ? "#7dd3fc" : "#b0d4f1");
            ctx.fillRect(x + ps, y + h - (ps * 2), w - (ps * 2), ps);
        }

        function drawPixelCoin(x, y) {
            const ps = 2;
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(x + ps, y, 4 * ps, 6 * ps);
            ctx.fillStyle = "#fff066";
            ctx.fillRect(x + (2 * ps), y + ps, 2 * ps, 4 * ps);
            ctx.fillStyle = "#cc9900";
            ctx.fillRect(x, y + ps, ps, 4 * ps);
            ctx.fillRect(x + (5 * ps), y + ps, ps, 4 * ps);
        }

        function drawPixelArtPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            
            if (!player.facingRight) {
                ctx.scale(-1, 1);
            }

            const ps = 3;

            if (player.skin === 0) {
                ctx.fillStyle = "#8b4513";
                ctx.fillRect(-4 * ps, -6 * ps, 8 * ps, 2 * ps);
                ctx.fillStyle = "#d4af37";
                ctx.fillRect(-3 * ps, -5 * ps, 6 * ps, 1 * ps);
                ctx.fillStyle = "#ffdbac";
                ctx.fillRect(-3 * ps, -4 * ps, 6 * ps, 3 * ps);
                ctx.fillStyle = "#000000";
                ctx.fillRect(-2 * ps, -3 * ps, 1 * ps, 1 * ps);
                ctx.fillRect(1 * ps, -3 * ps, 1 * ps, 1 * ps);
                ctx.fillStyle = "#3a86ff";
                ctx.fillRect(-4 * ps, -1 * ps, 8 * ps, 5 * ps);
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(-1 * ps, -1 * ps, 2 * ps, 3 * ps);
                ctx.fillStyle = "#4a3525";
                ctx.fillRect(-3 * ps, 4 * ps, 2 * ps, 2 * ps);
                ctx.fillRect(1 * ps, 4 * ps, 2 * ps, 2 * ps);
            } 
            else if (player.skin === 1) {
                ctx.fillStyle = "#ff3333";
                ctx.fillRect(-4 * ps, -6 * ps, 8 * ps, 1 * ps);
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(-4 * ps, -5 * ps, 8 * ps, 3 * ps);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-2 * ps, -4 * ps, 1 * ps, 1 * ps);
                ctx.fillRect(1 * ps, -4 * ps, 1 * ps, 1 * ps);
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(-4 * ps, -2 * ps, 8 * ps, 6 * ps);
                ctx.fillStyle = "#06b6d4";
                ctx.fillRect(-3 * ps, 0, 6 * ps, 1 * ps);
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(-3 * ps, 4 * ps, 2 * ps, 2 * ps);
                ctx.fillRect(1 * ps, 4 * ps, 2 * ps, 2 * ps);
            } 
            else if (player.skin === 2) {
                ctx.fillStyle = "#64748b";
                ctx.fillRect(-4 * ps, -6 * ps, 8 * ps, 2 * ps);
                ctx.fillStyle = "#22c55e";
                ctx.fillRect(-3 * ps, -4 * ps, 6 * ps, 2 * ps);
                ctx.fillStyle = "#475569";
                ctx.fillRect(-4 * ps, -2 * ps, 8 * ps, 6 * ps);
                ctx.fillStyle = "#4ade80";
                ctx.fillRect(-1 * ps, -1 * ps, 2 * ps, 4 * ps);
                ctx.fillStyle = "#334155";
                ctx.fillRect(-3 * ps, 4 * ps, 2 * ps, 2 * ps);
                ctx.fillRect(1 * ps, 4 * ps, 2 * ps, 2 * ps);
            }

            ctx.restore();
        }

        function draw() {
            let sunsetProgress = Math.min(displayScore / 400, 1);
            
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (sunsetProgress < 0.5) {
                let t = sunsetProgress * 2;
                grad.addColorStop(0, interpolateColor("#3a86ff", "#f97316", t));
                grad.addColorStop(1, interpolateColor("#c2e9fb", "#fed7aa", t));
            } else {
                let t = (sunsetProgress - 0.5) * 2;
                grad.addColorStop(0, interpolateColor("#f97316", "#0f172a", t));
                grad.addColorStop(1, interpolateColor("#fed7aa", "#1e293b", t));
            }

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            platforms.forEach(plat => {
                drawPixelCloud(plat.x, plat.y, plat.width, plat.height, plat.isMoving, plat.isFragile, plat.broken);
            });

            coins.forEach(coin => {
                drawPixelCoin(coin.x, coin.y);
            });

            drawPixelArtPlayer();
        }

        function interpolateColor(color1, color2, factor) {
            let c1 = parseInt(color1.slice(1), 16);
            let c2 = parseInt(color2.slice(1), 16);
            let r1 = (c1 >> 16), g1 = (c1 >> 8) & 255, b1 = c1 & 255;
            let r2 = (c2 >> 16), g2 = (c2 >> 8) & 255, b2 = c2 & 255;
            let r = Math.round(r1 + factor * (r2 - r1));
            let g = Math.round(g1 + factor * (g2 - g1));
            let b = Math.round(b1 + factor * (b2 - b1));
            return `rgb(${r},${g},${b})`;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initPlatforms();
        loop();
    </script>
