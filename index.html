<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Hop - Pixel Art</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            background: linear-gradient(to bottom, #3a86ff, #87ceeb);
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 5;
        }

        #start-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 100, 180, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 25px;
            text-align: center;
            z-index: 10;
        }

        #start-modal h1 {
            font-size: 32px;
            color: #ffe600;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #d4380d;
        }

        #start-modal p {
            font-size: 14px;
            color: #f0f0f0;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .controls-info {
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0;
            width: 100%;
        }

        .menu-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            align-items: center;
        }

        #start-btn {
            background: #ffcc00;
            color: #532d00;
            border: 3px solid #ff9900;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #cc7a00;
        }

        #start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cc7a00;
        }

        #shop-icon-btn {
            background: #22c55e;
            color: white;
            border: 3px solid #15803d;
            width: 50px;
            height: 50px;
            font-size: 22px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #166534;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #shop-icon-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #166534;
        }

        #shop-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.98);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 25px;
            z-index: 20;
        }

        #shop-modal h2 {
            color: #ffe600;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .shop-balance {
            font-size: 15px;
            color: #4efc8d;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .skin-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
        }

        .skin-item {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .skin-info {
            text-align: left;
        }

        .skin-name {
            font-weight: bold;
            font-size: 15px;
        }

        .skin-price {
            font-size: 12px;
            color: #ffcc00;
        }

        .skin-action-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .skin-action-btn.equipped {
            background: #22c55e;
            cursor: default;
        }

        .skin-action-btn.locked {
            background: #94a3b8;
            color: #334155;
            cursor: pointer;
        }

        .skin-action-btn.buyable {
            background: #eab308;
            color: #422006;
            cursor: pointer;
        }

        #close-shop-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div>Pontos: <span id="scoreVal">0</span></div>
            <div>🪙 <span id="coinsVal">0</span></div>
            <div>Recorde: <span id="highScoreVal">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div id="start-modal">
            <h1>SKY HOP</h1>
            <p>Suba pelas nuvens, colete moedas e conquiste o topo!</p>
            
            <div class="controls-info">
                <p>👈 Toque na <strong>esquerda</strong> | 👉 Toque na <strong>direita</strong></p>
            </div>

            <div class="menu-buttons">
                <button id="start-btn">JOGAR</button>
                <button id="shop-icon-btn" title="Loja de Skins">🛒</button>
            </div>
        </div>

        <div id="shop-modal">
            <h2>LOJA DE SKINS</h2>
            <div class="shop-balance">Suas Moedas: 🪙 <span id="shopCoinsVal">0</span></div>
            
            <div class="skin-list" id="skinListContainer"></div>

            <button id="close-shop-btn">VOLTAR</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONTROLE DE VERSÃO E RESET AUTOMÁTICO DE CACHE
        // ==========================================
        // ALERTA: Sempre que você modificar este arquivo e quiser que o app 
        // zere o cache e comece do zero, basta alterar este número (ex: de '1.0.0' para '1.0.1')
        const GAME_VERSION = "1.0.0"; 

        if (localStorage.getItem("sky_hop_version") !== GAME_VERSION) {
            localStorage.clear(); // Limpa todo o cache antigo do jogo
            localStorage.setItem("sky_hop_version", GAME_VERSION); // Define a nova versão
        }
        // ==========================================

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreValElement = document.getElementById("scoreVal");
        const coinsValElement = document.getElementById("coinsVal");
        const highScoreValElement = document.getElementById("highScoreVal");
        const startModal = document.getElementById("start-modal");
        const startBtn = document.getElementById("start-btn");
        const shopIconBtn = document.getElementById("shop-icon-btn");
        const shopModal = document.getElementById("shop-modal");
        const closeShopBtn = document.getElementById("close-shop-btn");
        const shopCoinsVal = document.getElementById("shopCoinsVal");
        const skinListContainer = document.getElementById("skinListContainer");

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playJumpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playCoinSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(987.77, now);
            osc.frequency.setValueAtTime(1318.51, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }

        function playMilestoneSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'square';
            osc1.frequency.setValueAtTime(800, now);
            gain1.gain.setValueAtTime(0.15, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.08);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(1200, now + 0.1);
            gain2.gain.setValueAtTime(0.15, now + 0.1);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.1);
            osc2.stop(now + 0.18);
        }

        function playGameOverSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        const skinsData = [
            { id: 0, name: "Clássico Amarelo", price: 0 },
            { id: 1, name: "Ninja Azul", price: 50 },
            { id: 2, name: "Robô Cyber", price: 100 }
        ];

        let totalCoins = parseInt(localStorage.getItem("sky_hop_coins")) || 0;
        let highScore = parseInt(localStorage.getItem("sky_hop_high_score")) || 0;
        let unlockedSkins = JSON.parse(localStorage.getItem("sky_hop_unlocked")) || [0];
        let currentSkin = parseInt(localStorage.getItem("sky_hop_current_skin")) || 0;

        highScoreValElement.innerText = highScore;
        coinsValElement.innerText = totalCoins;

        const GRAVITY = 0.38;
        const JUMP_FORCE = -9.8;
        const MOVE_SPEED = 5.5;

        let player = {
            x: canvas.width / 2 - 18,
            y: 400,
            width: 36,
            height: 38,
            vx: 0,
            vy: 0,
            facingRight: true,
            skin: currentSkin
        };

        let platforms = [];
        let coins = [];
        const platformWidth = 80;
        const platformHeight = 20;
        let score = 0;
        let displayScore = 0;
        let lastMilestone = 0;
        let gameStarted = false;
        let gameOver = false;
        let lastCoinY = 0;

        function renderShop() {
            shopCoinsVal.innerText = totalCoins;
            skinListContainer.innerHTML = "";

            skinsData.forEach(skin => {
                let isUnlocked = unlockedSkins.includes(skin.id);
                let isEquipped = (player.skin === skin.id);

                let btnClass = "";
                let btnText = "";

                if (isEquipped) {
                    btnClass = "equipped";
                    btnText = "Equipado";
                } else if (isUnlocked) {
                    btnClass = "";
                    btnText = "Equipar";
                } else {
                    if (totalCoins >= skin.price) {
                        btnClass = "buyable";
                        btnText = `Comprar (${skin.price}🪙)`;
                    } else {
                        btnClass = "locked";
                        btnText = `${skin.price}🪙`;
                    }
                }

                let itemDiv = document.createElement("div");
                itemDiv.className = "skin-item";
                itemDiv.innerHTML = `
                    <div class="skin-info">
                        <div class="skin-name">${skin.name}</div>
                        <div class="skin-price">${skin.price === 0 ? 'Grátis' : skin.price + ' moedas'}</div>
                    </div>
                    <button class="skin-action-btn ${btnClass}" data-id="${skin.id}">${btnText}</button>
                `;

                skinListContainer.appendChild(itemDiv);
            });

            document.querySelectorAll(".skin-action-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    let skinId = parseInt(e.target.getAttribute("data-id"));
                    let skin = skinsData.find(s => s.id === skinId);

                    if (unlockedSkins.includes(skinId)) {
                        player.skin = skinId;
                        localStorage.setItem("sky_hop_current_skin", skinId);
                        renderShop();
                    } else {
                        if (totalCoins >= skin.price) {
                            totalCoins -= skin.price;
                            coinsValElement.innerText = totalCoins;
                            localStorage.setItem("sky_hop_coins", totalCoins);

                            unlockedSkins.push(skinId);
                            localStorage.setItem("sky_hop_unlocked", JSON.stringify(unlockedSkins));

                            player.skin = skinId;
                            localStorage.setItem("sky_hop_current_skin", skinId);

                            playCoinSound();
                            renderShop();
                        }
                    }
                });
            });
        }

        shopIconBtn.addEventListener("click", () => {
            initAudio();
            renderShop();
            shopModal.style.display = "flex";
        });

        closeShopBtn.addEventListener("click", () => {
            shopModal.style.display = "none";
        });

        function createPlatform(y) {
            let p = {
                x: Math.random() * (canvas.width - platformWidth),
                y: y,
                width: platformWidth,
                height: platformHeight,
                isMoving: false,
                moveSpeed: 0,
                direction: 1
            };

            if (Math.random() < 0.30 && (lastCoinY === 0 || Math.abs(y - lastCoinY) > 220)) {
                coins.push({
                    x: p.x + p.width / 2 - 8,
                    y: y - 35,
                    width: 16,
                    height: 16
                });
                lastCoinY = y;
            }

            return p;
        }

        function initPlatforms() {
            platforms = [];
            coins = [];
            lastCoinY = 0;
            platforms.push({ x: canvas.width / 2 - 40, y: 520, width: platformWidth, height: platformHeight, isMoving: false });

            let currentY = 440;
            while (currentY > -50) {
                platforms.push(createPlatform(currentY));
                currentY -= 75 + Math.random() * 25;
            }
        }

        let leftPressed = false;
        let rightPressed = false;

        window.addEventListener("touchstart", (e) => {
            if (!gameStarted || shopModal.style.display === "flex") return;
            if (gameOver) {
                resetGame();
                return;
            }
            let touchX = e.touches[0].clientX;
            let screenWidth = window.innerWidth;
            if (touchX < screenWidth / 2) {
                leftPressed = true;
                rightPressed = false;
            } else {
                rightPressed = true;
                leftPressed = false;
            }
        });

        window.addEventListener("touchend", () => {
            leftPressed = false;
            rightPressed = false;
        });

        window.addEventListener("keydown", (e) => {
            if (!gameStarted || shopModal.style.display === "flex") return;
            if (e.key === "Enter" && gameOver) {
                resetGame();
                return;
            }
            if (e.key === "ArrowLeft") leftPressed = true;
            if (e.key === "ArrowRight") rightPressed = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft") leftPressed = false;
            if (e.key === "ArrowRight") rightPressed = false;
        });

        startBtn.addEventListener("click", () => {
            initAudio();
            startModal.style.display = "none";
            gameStarted = true;
            resetGame();
        });

        function update() {
            if (!gameStarted || gameOver) return;

            if (leftPressed) {
                player.vx = -MOVE_SPEED;
                player.facingRight = false;
            } else if (rightPressed) {
                player.vx = MOVE_SPEED;
                player.facingRight = true;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;

            if (player.x > canvas.width) player.x = -player.width;
            if (player.x + player.width < 0) player.x = canvas.width;

            player.vy += GRAVITY;
            player.y += player.vy;

            platforms.forEach(plat => {
                if (plat.isMoving) {
                    plat.x += plat.moveSpeed * plat.direction;
                    if (plat.x <= 0 || plat.x + plat.width >= canvas.width) {
                        plat.direction *= -1;
                    }
                }
            });

            if (player.vy > 0) {
                platforms.forEach(plat => {
                    if (
                        player.x + player.width - 8 > plat.x &&
                        player.x + 8 < plat.x + plat.width &&
                        player.y + player.height >= plat.y + 4 &&
                        player.y + player.height <= plat.y + plat.height + player.vy
                    ) {
                        player.vy = JUMP_FORCE;
                        playJumpSound();
                    }
                });
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                if (
                    player.x < coin.x + coin.width &&
                    player.x + player.width > coin.x &&
                    player.y < coin.y + coin.height &&
                    player.y + player.height > coin.y
                ) {
                    coins.splice(i, 1);
                    totalCoins++;
                    coinsValElement.innerText = totalCoins;
                    localStorage.setItem("sky_hop_coins", totalCoins);
                    playCoinSound();
                }
            }

            let cameraThreshold = canvas.height * 0.45;
            if (player.y < cameraThreshold) {
                let diff = cameraThreshold - player.y;
                player.y = cameraThreshold;
                score += diff;
                
                displayScore = Math.floor(score / 10);
                scoreValElement.innerText = displayScore;

                if (displayScore >= lastMilestone + 100) {
                    lastMilestone = Math.floor(displayScore / 100) * 100;
                    playMilestoneSound();
                }

                platforms.forEach(plat => plat.y += diff);
                coins.forEach(coin => coin.y += diff);
                lastCoinY += diff;
            }

            platforms.forEach(plat => {
                if (plat.y > canvas.height) {
                    plat.y = -20;
                    plat.x = Math.random() * (canvas.width - platformWidth);
                    plat.direction = Math.random() < 0.5 ? 1 : -1;

                    if (displayScore >= 600) {
                        plat.isMoving = Math.random() < 0.50;
                        plat.moveSpeed = 2.2 + Math.random() * 1.5;
                    } else if (displayScore >= 300) {
                        plat.isMoving = Math.random() < 0.30;
                        plat.moveSpeed = 1.2 + Math.random() * 0.8;
                    } else {
                        plat.isMoving = false;
                    }

                    if (Math.random() < 0.30 && (lastCoinY === 0 || Math.abs(plat.y - lastCoinY) > 220)) {
                        coins.push({
                            x: plat.x + plat.width / 2 - 8,
                            y: plat.y - 35,
                            width: 16,
                            height: 16
                        });
                        lastCoinY = plat.y;
                    }
                }
            });

            coins = coins.filter(coin => coin.y < canvas.height + 50);

            if (player.y > canvas.height) {
                gameOver = true;
                playGameOverSound();
                if (displayScore > highScore) {
                    highScore = displayScore;
                    localStorage.setItem("sky_hop_high_score", highScore);
                    highScoreValElement.innerText = highScore;
                }
            }
        }

        function resetGame() {
            player.x = canvas.width / 2 - 18;
            player.y = 400;
            player.vx = 0;
            player.vy = 0;
            player.facingRight = true;
            score = 0;
            displayScore = 0;
            lastMilestone = 0;
            scoreValElement.innerText = "0";
            gameOver = false;
            initPlatforms();
        }

        function drawPixelCloud(x, y, w, h, isMoving) {
            const ps = 4;
            ctx.fillStyle = isMoving ? "#e0f2fe" : "#ffffff";
            ctx.fillRect(x + ps, y + ps, w - (ps * 2), h - (ps * 2));
            ctx.fillRect(x, y + (ps * 2), w, h - (ps * 4));
            ctx.fillRect(x + (ps * 2), y, w - (ps * 4), ps);
            ctx.fillRect(x + (ps * 3), y - ps, w - (ps * 6), ps);

            ctx.fillStyle = isMoving ? "#7dd3fc" : "#b0d4f1";
            ctx.fillRect(x + ps, y + h - (ps * 2), w - (ps * 2), ps);
        }

        function drawPixelCoin(x, y) {
            const ps = 2;
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(x + ps, y, 4 * ps, 6 * ps);
            ctx.fillStyle = "#fff066";
            ctx.fillRect(x + (2 * ps), y + ps, 2 * ps, 4 * ps);
            ctx.fillStyle = "#cc9900";
            ctx.fillRect(x, y + ps, ps, 4 * ps);
            ctx.fillRect(x + (5 * ps), y + ps, ps, 4 * ps);
        }

        function drawPixelArtPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            
            if (!player.facingRight) {
                ctx.scale(-1, 1);
            }

            const ps = 3;

            if (player.skin === 0) {
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(-4 * ps, -3 * ps, 8 * ps, 7 * ps);
                ctx.fillStyle = "#ff3333";
                ctx.fillRect(-5 * ps, -5 * ps, 10 * ps, 2 * ps);
                ctx.fillRect(-3 * ps, -6 * ps, 6 * ps, 1 * ps);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-1 * ps, -5 * ps, 2 * ps, 1 * ps);
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, -2 * ps, 2 * ps, 2 * ps);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-3 * ps, 4 * ps, 2 * ps, 2 * ps);
                ctx.fillRect(1 * ps, 4 * ps, 2 * ps, 2 * ps);
            } 
            else if (player.skin === 1) {
                ctx.fillStyle = "#3366ff";
                ctx.fillRect(-4 * ps, -3 * ps, 8 * ps, 7 * ps);
                ctx.fillStyle = "#1a3399";
                ctx.fillRect(-4 * ps, -5 * ps, 8 * ps, 2 * ps);
                ctx.fillStyle = "#ff3333";
                ctx.fillRect(-4 * ps, -4 * ps, 8 * ps, 1 * ps);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, -3 * ps, 2 * ps, 1 * ps);
                ctx.fillStyle = "#1a3399";
                ctx.fillRect(-3 * ps, 4 * ps, 2 * ps, 2 * ps);
                ctx.fillRect(1 * ps, 4 * ps, 2 * ps, 2 * ps);
            } 
            else if (player.skin === 2) {
                ctx.fillStyle = "#cccccc";
                ctx.fillRect(-4 * ps, -3 * ps, 8 * ps, 7 * ps);
                ctx.fillStyle = "#999999";
                ctx.fillRect(-4 * ps, -5 * ps, 8 * ps, 2 * ps);
                ctx.fillStyle = "#00ff66";
                ctx.fillRect(-1 * ps, -3 * ps, 3 * ps, 1 * ps);
                ctx.fillStyle = "#666666";
                ctx.fillRect(-3 * ps, 4 * ps, 2 * ps, 2 * ps);
                ctx.fillRect(1 * ps, 4 * ps, 2 * ps, 2 * ps);
            }

            ctx.restore();
        }

        function draw() {
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, "#3a86ff");
            grad.addColorStop(0.5, "#6ea8fe");
            grad.addColorStop(1, "#c2e9fb");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            platforms.forEach(plat => {
                drawPixelCloud(plat.x, plat.y, plat.width, plat.height, plat.isMoving);
            });

            coins.forEach(coin => {
                drawPixelCoin(coin.x, coin.y);
            });

            drawPixelArtPlayer();

            if (gameOver) {
                ctx.fillStyle = "rgba(10, 30, 60, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffe600";
                ctx.font = "bold 30px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("FIM DE JOGO", canvas.width / 2, canvas.height / 2 - 55);

                ctx.font = "16px sans-serif";
                ctx.fillStyle = "#ffffff";
                ctx.fillText(`Pontuação: ${displayScore}`, canvas.width / 2, canvas.height / 2 - 15);

                ctx.fillStyle = "#ffcc00";
                ctx.fillText(`Moedas Coletadas: ${totalCoins}`, canvas.width / 2, canvas.height / 2 + 15);

                ctx.fillStyle = "#c2e9fb";
                ctx.font = "13px sand-serif";
                ctx.fillText("Toque na tela para jogar novamente", canvas.width / 2, canvas.height / 2 + 65);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initPlatforms();
        loop();
    </script>
</body>
</html>
